name: sandhome

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every file is checked by the shell that will read it and by a second
      # reader, so a file that is valid under dash and not under bash is found
      # here rather than on the machine it was installed on.
      - name: seating
        run: |
          set -e
          command -v dash || { sudo apt-get update -qq && sudo apt-get install -y dash; }
          dash -c 'echo "dash ok"'

      # The machine-readable report is parsed here, not eyeballed: a --json
      # that is not JSON is a defect, and this is where it is caught. It runs
      # before the suite so a broken report is named in seconds rather than at
      # the end of a four-minute run.
      - name: the JSON report parses
        run: |
          set -e
          sh bootstrap.sh --toolset minimal --no-profile --no-path-line --no-shell --no-global --json > report.json
          jq -e '.schema == "sandhome/1"' report.json > /dev/null
          sh bin/sandhome toolchains --json | jq -e 'length > 0' > /dev/null
          sh bin/sandhome report --json | jq -e 'has("failures")' > /dev/null
          echo "the report is valid JSON"

      # The generated reference must be what the generator produces. This is
      # also checked by tests/docs.sh inside the suite; it is run first as its
      # own step so a stale document is named in one line of the CI output
      # rather than inside a test file's tally.
      - name: the generated reference is current
        run: |
          set -e
          sh docs/generate-reference.sh > /tmp/reference.md
          if ! diff -u docs/reference.md /tmp/reference.md; then
            echo "::error file=docs/reference.md::drifted; run sh docs/generate-reference.sh > docs/reference.md"
            exit 1
          fi
          echo "the reference matches the code"

      # THE SUITE IS THE GATE, AND IT RUNS EACH FILE EXACTLY ONCE. `run.sh`
      # already runs harness, syntax, unit, space, fetch, toolchain, memexec,
      # shims, docs, bootstrap and errandsh-posix, and reads every file's own
      # tally as well as its exit status. The workflow used to run syntax,
      # unit/space/toolchain/shims/docs, the end-to-end install and the line
      # discipline as their own steps and then run all of them AGAIN here, so
      # every suite paid for itself twice. One caller keeps the two claims
      # apart the same way: only `failed` turns the job red, and `skipped` is
      # a fact about the runner.
      - name: the whole suite, as a caller reads it
        run: sh tests/run.sh
