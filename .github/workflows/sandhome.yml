name: sandhome

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every file is checked by the shell that will read it and by a second
      # reader, so a file that is valid under dash and not under bash is found
      # here rather than on the machine it was installed on.
      - name: seating
        run: |
          set -e
          command -v dash || { sudo apt-get update -qq && sudo apt-get install -y dash; }
          dash -c 'echo "dash ok"'

      - name: POSIX syntax under dash and bash
        run: sh tests/syntax.sh

      # The pure helpers, the two-root plan, the mirror, the framework, the
      # shims, and the documentation checks. None of these need a network
      # except the shims, which need a compiler.
      - name: helpers, plan, mirror, framework, shims, docs
        run: |
          sh tests/unit.sh
          sh tests/space.sh
          sh tests/toolchain.sh
          sh tests/shims.sh
          sh tests/docs.sh

      # The end-to-end install needs the network. When it cannot run it exits 2
      # and says so; that is `skipped`, not `failed`, and the runner reports
      # the two separately so a red job always means a defect.
      - name: the end-to-end install
        run: sh tests/bootstrap.sh

      - name: the line discipline over pipes
        run: bash tests/errandsh-posix.sh

      # The machine-readable report is parsed here, not eyeballed: a --json
      # that is not JSON is a defect, and this is where it is caught.
      - name: the JSON report parses
        run: |
          set -e
          sh bootstrap.sh --toolset minimal --no-profile --no-path-line --no-shell --json > report.json
          jq -e '.schema == "sandhome/1"' report.json > /dev/null
          sh bin/sandhome toolchains --json | jq -e 'length > 0' > /dev/null
          sh bin/sandhome report --json | jq -e 'has("failures")' > /dev/null
          echo "the report is valid JSON"

      # The generated reference must be what the generator produces, which is
      # the same check tests/docs.sh makes. It is run again here as its own
      # job so a stale document is named in one line of the CI output rather
      # than inside a test file's tally.
      - name: the generated reference is current
        run: |
          set -e
          sh docs/generate-reference.sh > /tmp/reference.md
          if ! diff -u docs/reference.md /tmp/reference.md; then
            echo "::error file=docs/reference.md::drifted; run sh docs/generate-reference.sh > docs/reference.md"
            exit 1
          fi
          echo "the reference matches the code"

      - name: the whole suite, as a caller reads it
        run: sh tests/run.sh
